name: Sincronizar odds das temporadas atuais

on:
  schedule:
    # Terça-feira às 09:17 no horário de Brasília (12:17 UTC).
    # Minutos fora da hora cheia reduzem atrasos por alta demanda.
    - cron: "17 12 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odds-semanal
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web_app

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web_app/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Verificar configuração
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FUTPYTHONTRADER_API_KEY: ${{ secrets.FUTPYTHONTRADER_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${SUPABASE_DB_URL}" || -z "${FUTPYTHONTRADER_API_KEY}" ]]; then
            echo "::error::Configure os Secrets SUPABASE_DB_URL e FUTPYTHONTRADER_API_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Atualizar campeonatos e registrar resumo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FUTPYTHONTRADER_API_KEY: ${{ secrets.FUTPYTHONTRADER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/sync_odds_weekly.py
