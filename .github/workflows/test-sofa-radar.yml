name: Escalações Sofascore e radar de técnicos

on:
  pull_request:
    paths:
      - 'web_app/queries_coach_radar.py'
      - 'web_app/static/js/match.js'
      - 'web_app/static/js/profile-radar.js'
      - 'web_app/app.py'
      - 'web_app/templates/match.html'
      - 'web_app/templates/entity.html'
      - 'web_app/static/css/app.css'
      - 'web_app/tests/test_coach_radar.py'
      - 'web_app/tests/test_sofa_lineups_coach_radar.js'
      - '.github/workflows/test-sofa-radar.yml'
  push:
    branches: [main]
    paths:
      - 'web_app/queries_coach_radar.py'
      - 'web_app/static/js/match.js'
      - 'web_app/static/js/profile-radar.js'
      - 'web_app/app.py'
      - 'web_app/templates/match.html'
      - 'web_app/templates/entity.html'
      - 'web_app/static/css/app.css'
      - 'web_app/tests/test_coach_radar.py'
      - 'web_app/tests/test_sofa_lineups_coach_radar.js'
      - '.github/workflows/test-sofa-radar.yml'
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: python -m pip install -r web_app/requirements.txt
      - name: Verificar sintaxe do backend
        run: python -m compileall -q web_app/app.py web_app/queries_coach_radar.py web_app/queries.py
      - name: Testar agregação do radar
        working-directory: web_app
        run: python -m unittest discover -s tests -p 'test_coach_radar.py' -v
      - name: Validar os módulos JavaScript
        working-directory: web_app
        run: |
          node --check static/js/match.js
          node --check static/js/profile-radar.js
      - name: Testar widget e radar
        working-directory: web_app
        run: node tests/test_sofa_lineups_coach_radar.js
