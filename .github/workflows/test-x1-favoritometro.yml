name: Testes Favoritômetro x1
on:
  pull_request:
    paths:
      - 'web_app/static/js/bets-x1-favoritometro.js'
      - 'web_app/queries_x1_texto.py'
      - 'web_app/tests/test_x1_favoritometro.js'
      - 'web_app/tests/test_x1_texto.py'
      - '.github/workflows/test-x1-favoritometro.yml'
  push:
    branches: [main]
    paths:
      - 'web_app/static/js/bets-x1-favoritometro.js'
      - 'web_app/queries_x1_texto.py'
      - 'web_app/tests/test_x1_favoritometro.js'
      - 'web_app/tests/test_x1_texto.py'
      - '.github/workflows/test-x1-favoritometro.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r web_app/requirements.txt
      - name: Compile code
        run: python -m compileall -q web_app/queries_x1_texto.py web_app/app.py
      - name: Python tests
        working-directory: web_app
        run: python -m unittest discover -s tests -p 'test_x1_texto.py' -v
      - name: Syntax JS
        run: |
          node --check web_app/static/js/bets-x1-favoritometro.js
          node --check web_app/static/js/bets-x1.js
          node --check web_app/static/js/bets-x1-analise.js
      - name: JS tests
        working-directory: web_app
        run: node tests/test_x1_favoritometro.js
