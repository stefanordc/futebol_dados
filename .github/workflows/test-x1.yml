name: Teste modelo x1
on:
  pull_request:
    paths:
      - 'web_app/queries_x1.py'
      - 'web_app/tests/test_x1.py'
      - '.github/workflows/test-x1.yml'
  push:
    branches: [main]
    paths:
      - 'web_app/queries_x1.py'
      - 'web_app/tests/test_x1.py'
      - '.github/workflows/test-x1.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r web_app/requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q web_app/queries_x1.py
      - name: Unit tests (database mocked)
        working-directory: web_app
        run: python -m unittest discover -s tests -p 'test_x1*.py' -v
