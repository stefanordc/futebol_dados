name: Galileu — validação e livro de entradas
on:
  pull_request:
    paths:
      - 'web_app/queries_galileu.py'
      - 'web_app/queries_galileu_gameplay.py'
      - 'web_app/tests/test_galileu_gameplay.py'
      - 'web_app/tests/test_galileu_ao_vivo.py'
      - 'web_app/queries_nostradamus_aovivo.py'
      - 'web_app/tests/test_galileu_fechamento_metodos.py'
      - 'web_app/tests/test_galileu_fechamento_metodos_ui.js'
      - 'web_app/sql/galileu_metodos_desativados.sql'
      - 'web_app/tests/test_galileu_relatorios_agrupados.py'
      - 'web_app/tests/test_galileu_relatorios_ui.js'
      - 'web_app/tests/test_galileu_programadas.py'
      - 'web_app/sql/galileu_entradas_programadas_sem_saldo.sql'
      - 'web_app/tests/test_galileu_gameplay_route.py'
      - 'web_app/tests/test_galileu_gameplay_ui.js'
      - 'web_app/tests/test_galileu_bulk_money.js'
      - 'web_app/tests/test_galileu_financeiro_ui.js'
      - 'web_app/sql/galileu_gestao_mensal_relatorios.sql'
      - 'web_app/sql/galileu_gameplay.sql'
      - 'web_app/queries_estrategias.py'
      - 'web_app/static/js/galileu.js'
      - 'web_app/templates/galileu*.html'
      - 'web_app/static/js/galileu*.js'
      - 'web_app/static/css/galileu.css'
      - 'web_app/tests/test_galileu.py'
      - '.github/workflows/test-galileu.yml'
  push:
    branches: [main]
    paths:
      - 'web_app/queries_galileu.py'
      - 'web_app/queries_galileu_gameplay.py'
      - 'web_app/tests/test_galileu_gameplay.py'
      - 'web_app/tests/test_galileu_ao_vivo.py'
      - 'web_app/queries_nostradamus_aovivo.py'
      - 'web_app/tests/test_galileu_fechamento_metodos.py'
      - 'web_app/tests/test_galileu_fechamento_metodos_ui.js'
      - 'web_app/sql/galileu_metodos_desativados.sql'
      - 'web_app/tests/test_galileu_relatorios_agrupados.py'
      - 'web_app/tests/test_galileu_relatorios_ui.js'
      - 'web_app/tests/test_galileu_programadas.py'
      - 'web_app/sql/galileu_entradas_programadas_sem_saldo.sql'
      - 'web_app/tests/test_galileu_gameplay_route.py'
      - 'web_app/tests/test_galileu_gameplay_ui.js'
      - 'web_app/tests/test_galileu_bulk_money.js'
      - 'web_app/tests/test_galileu_financeiro_ui.js'
      - 'web_app/sql/galileu_gestao_mensal_relatorios.sql'
      - 'web_app/sql/galileu_gameplay.sql'
      - 'web_app/queries_estrategias.py'
      - 'web_app/static/js/galileu.js'
      - 'web_app/tests/test_galileu.py'
      - '.github/workflows/test-galileu.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install -r web_app/requirements.txt
      - name: Sintaxe Python
        run: python -m compileall -q web_app/app.py web_app/queries_galileu.py web_app/queries_galileu_gameplay.py
      - name: Sintaxe JavaScript
        run: |
          node --check web_app/static/js/galileu.js
          node --check web_app/static/js/galileu-report.js
          node --check web_app/static/js/galileu-gameplay.js
          node --check web_app/static/js/galileu-financeiro.js
      - name: Sem vazamento e apuração de banca
        working-directory: web_app
        run: |
          python -m unittest discover -s tests -p 'test_galileu.py' -v
          python -m unittest discover -s tests -p 'test_galileu_gameplay.py' -v
          python -m unittest discover -s tests -p 'test_galileu_ao_vivo.py' -v
          python -m unittest discover -s tests -p 'test_galileu_fechamento_metodos.py' -v
          python -m unittest discover -s tests -p 'test_galileu_relatorios_agrupados.py' -v
          python -m unittest discover -s tests -p 'test_galileu_programadas.py' -v
          python -m unittest discover -s tests -p 'test_galileu_gameplay_route.py' -v
      - name: Interface gameplay
        working-directory: web_app
        run: |
          node tests/test_galileu_gameplay_ui.js
          node tests/test_galileu_fechamento_metodos_ui.js
          node tests/test_galileu_bulk_money.js
          node tests/test_galileu_financeiro_ui.js
          node tests/test_galileu_relatorios_ui.js
