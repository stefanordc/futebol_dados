name: Testes de estatísticas dos técnicos
on:
  pull_request:
    paths:
      - 'web_app/queries_tecnico_avancadas.py'
      - 'web_app/tests/test_coach_advanced.py'
      - '.github/workflows/test-coach-advanced.yml'
  push:
    branches: [main]
    paths:
      - 'web_app/queries_tecnico_avancadas.py'
      - 'web_app/tests/test_coach_advanced.py'
      - '.github/workflows/test-coach-advanced.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r web_app/requirements.txt
      - name: Validar sintaxe
        run: python -m compileall -q web_app/queries_tecnico_avancadas.py
      - name: Testar agregações com dados simulados
        working-directory: web_app
        run: python -m unittest discover -s tests -p 'test_coach_advanced.py' -v
